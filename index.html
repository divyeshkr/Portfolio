    <style>
      :root {
        --charcoal: #121212;
        --recording-red: #FF2C2C;

        --dark-crimson: #4A0404;
        --soft-white: #EDEDED;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--charcoal);
        color: var(--soft-white);
        overflow-x: hidden;
      }
      .neon-glow {
        text-shadow: 0 0 10px rgba(255, 44, 44, 0.7), 0 0 20px rgba(255, 95, 31, 0.4);
      }
      .neon-border {
        box-shadow: 0 0 15px rgba(255, 44, 44, 0.3), 0 0 5px rgba(255, 95, 31, 0.2);
      }
      @keyframes cta-pulse {
        0% { box-shadow: 0 0 0 0 rgba(255, 44, 44, 0.7); }
        70% { box-shadow: 0 0 0 15px rgba(255, 95, 31, 0); }
        100% { box-shadow: 0 0 0 0 rgba(255, 44, 44, 0); }
      }
      .animate-cta-pulse {
        animation: cta-pulse 3s infinite;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #000000;
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(to bottom, var(--recording-red), var(--orange-red));
        border-radius: 4px;
      }
      .kinetic-text {
        letter-spacing: -0.05em;
      }
      .depth-shadow {
        box-shadow: 0 25px 50px -12px rgba(74, 4, 4, 0.5);
      }
